name: Build unsigned iOS app
on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/build-ipa']
    paths: ['apps/house-capture/**', '.github/workflows/build-ipa.yml']
permissions:
  contents: read
jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - run: brew install xcodegen
      - name: Build (no signing)
        working-directory: apps/house-capture
        run: |
          xcodegen generate
          xcodebuild -project HouseCapture.xcodeproj -scheme HouseCapture \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        working-directory: apps/house-capture
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HouseCapture.app Payload/
          zip -qry HouseCapture-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: HouseCapture-unsigned-ipa
          path: apps/house-capture/HouseCapture-unsigned.ipa
